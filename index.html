<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <header>
            <div>
                <h1>💰 Expense Tracker</h1>
                <p class="subtitle">Track your money, manage your life.</p>
            </div>
        </header>

        <section class="summary">
            <div class="summary-card total">
                <p>Total Expenses</p>
                <h2 id="totalAmount">₹0.00</h2>
            </div>

            <div class="summary-card count">
                <p>Total Transactions</p>
                <h2 id="totalCount">0</h2>
            </div>
        </section>

        <section class="form-card">
            <h2 id="formTitle">➕ Add New Expense</h2>

            <form id="expenseForm">
                <input type="hidden" id="expenseId">

                <div class="input-group">
                    <label for="expenseName">Expense Name</label>
                    <input type="text" id="expenseName"
                           placeholder="e.g. Groceries" required>
                </div>

                <div class="input-group">
                    <label for="expenseAmount">Amount (₹)</label>
                    <input type="number" id="expenseAmount"
                           placeholder="Enter amount" min="0.01"
                           step="0.01" required>
                </div>

                <div class="input-group">
                    <label for="expenseCategory">Category</label>
                    <select id="expenseCategory" required>
                        <option value="">Select Category</option>
                        <option value="Food">🍕 Food</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Travel">🚗 Travel</option>
                        <option value="Education">📚 Education</option>
                        <option value="Bills">💡 Bills</option>
                        <option value="Health">💊 Health</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="expenseDate">Date</label>
                    <input type="date" id="expenseDate" required>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="submitBtn">
                        Add Expense
                    </button>

                    <button type="button" id="cancelBtn" class="cancel hidden">
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="list-card">
            <div class="list-header">
                <h2>📋 Expense History</h2>
            </div>

            <div id="expenseList"></div>
        </section>

        <button id="clearAllBtn" class="clear-all">
            🗑️ Clear All Expenses
        </button>

        <footer>
            Made with ❤️ | Expense Tracker
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
